apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: diet-api

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - internal
      - external

dependencies:
  resources:
    - ref: what-ever-diet-db
      envBindings:
        dbname: DIET_DB_DBNAME
        host: DIET_DB_HOST
        password: DIET_DB_PASSWORD
        port: DIET_DB_PORT
        user: DIET_DB_USER
    - ref: what-ever-user-auth
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        scopes: USER_AUTH_SCOPES
    - ref: what-ever-whatsapp
      envBindings:
        WHATSAPP_ACCESS_TOKEN: WHATSAPP_ACCESS_TOKEN
        WHATSAPP_PHONE_NUMBER_ID: WHATSAPP_PHONE_NUMBER_ID
    - ref: what-ever-nutriti-5b086401
      envBindings:
        FDC_API_KEY: FDC_API_KEY
