                brandOwner:
                    example: Kar Nut Products Company
                    type: string
                brandedFoodCategory:
                    example: Popcorn, Peanuts, Seeds & Related Snacks
                    type: string
                dataSource:
                    example: LI
                    type: string
                dataType:
                    example: Branded
                    type: string
                description:
                    example: NUT 'N BERRY MIX
