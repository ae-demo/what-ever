                wweiaFoodCategoryDescription:
                    example: Meat mixed dishes
                    type: string
    securitySchemes:
        ApiKeyAuth:
            in: query
            name: api_key
            type: apiKey
info:
    contact:
        name: Food Data Central Contact Form
        url: https://nal.altarama.com/reft100.aspx?key=FoodData
    description: "The FoodData Central API provides REST access to FoodData Central (FDC). It is intended primarily to assist application developers wishing to incorporate nutrient data into their applications or websites.\n  To take full advantage of the API, developers should familiarize themselves with the database by reading the database documentation available via links on Data Type Documentation. This documentation provides the detailed definitions and descriptions needed to understand the data elements referenced in the API documentation.\n  \n  Additional details about the API including rate limits, access, and licensing are available on the FDC website (https://fdc.nal.usda.gov/api-guide.html)"
    license:
        name: Creative Commons 0 1.0 Universal
        url: https://creativecommons.org
    title: Food Data Central API
    version: 1.0.0
openapi: 3.0.0
paths:
    /v1/food/{fdcId}:
        get:
            description: Retrieves a single food item by an FDC ID. Optional format and nutrients can be specified.
            operationId: getFood
            parameters:
                - description: FDC id of the food to retrieve
                  in: path
                  name: fdcId
                  required: true
                  schema:
                    type: string
                - description: Optional. 'abridged' for an abridged set of elements, 'full' for all elements (default).
                  in: query
                  name: format
                  required: false
                  schema:
                    enum:
                        - abridged
                        - full
                    type: string
                - description: Optional. List of up to 25 nutrient numbers. Only the nutrient information for the specified nutrients will be returned.
                  in: query
                  name: nutrients
                  schema:
                    example:
                        - 203
                        - 204
                        - 205
                    items:
                        type: integer
                    maxItems: 25
                    minItems: 1
                    type: array
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/AbridgedFoodItem'
                                    - $ref: '#/components/schemas/BrandedFoodItem'
                                    - $ref: '#/components/schemas/FoundationFoodItem'
                                    - $ref: '#/components/schemas/SRLegacyFoodItem'
                                    - $ref: '#/components/schemas/SurveyFoodItem'
                    description: One food result.
                "400":
                    description: bad input parameter
                "404":
                    description: no results found
            security:
                - ApiKeyAuth: []
            summary: Fetches details for one food item by FDC ID
            tags:
                - FDC
    /v1/foods/search:
        get:
            description: Search for foods using keywords. Results can be filtered by dataType and there are options for result page sizes or sorting.
            operationId: getFoodsSearch
            parameters:
                - description: One or more search terms.
                  example: cheddar cheese
                  in: query
                  name: query
                  required: true
                  schema:
                    type: string
                - description: Optional. Filter on a specific data type; specify one or more values in an array.
                  example:
                    - Foundation
                    - SR Legacy
                  explode: false
                  in: query
                  name: dataType
                  schema:
                    items:
                        enum:
                            - Branded
                            - Foundation
                            - Survey (FNDDS)
                            - SR Legacy
                        type: string
                    maxItems: 4
                    minItems: 1
                    type: array
                  style: form
                - description: Optional. Maximum number of results to return for the current page. Default is 50.
                  example: 25
                  in: query
                  name: pageSize
                  schema:
                    maximum: 200
                    minimum: 1
                    type: integer
                - description: Optional. Page number to retrieve.
                  in: query
                  name: pageNumber
                  schema:
                    example: 2
                    type: integer
                - description: Optional. Specify one of the possible values to sort by that field.
                  example: description
                  in: query
                  name: sortBy
                  schema:
                    enum:
                        - dataType.keyword
                        - lowercaseDescription.keyword
                        - fdcId
                        - publishedDate
                    type: string
                - description: Optional. The sort direction for the results.
                  example: asc
                  in: query
                  name: sortOrder
                  schema:
                    enum:
                        - asc
                        - desc
                    type: string
                - description: Optional. Filter results based on the brand owner of the food. Only applies to Branded Foods
                  example: Kar Nut Products Company
                  in: query
                  name: brandOwner
                  schema:
                    type: string
            responses:
                "200":
