                name:
                    example: External fat
                    type: string
                percentWeight:
                    example: 0.5
                    type: number
        FoodNutrient:
            properties:
                amount:
                    example: 0
                    format: float
                    type: number
                dataPoints:
                    example: 49
                    format: int32
                    type: integer
                foodNutrientDerivation:
                    $ref: '#/components/schemas/FoodNutrientDerivation'
                id:
                    example: 167514
                    format: uint
                    type: integer
                max:
                    example: 91.8
                    format: float
                    type: number
                median:
                    example: 90.3
                    format: float
                    type: number
                min:
                    example: 73.73
                    format: float
                    type: number
                nutrient:
                    $ref: '#/components/schemas/Nutrient'
                nutrientAnalysisDetails:
                    $ref: '#/components/schemas/NutrientAnalysisDetails'
                type:
                    example: FoodNutrient
                    type: string
            required:
                - id
                - nutrientNumber
                - unit
        FoodNutrientDerivation:
            properties:
                code:
                    example: LCCD
                    type: string
                description:
                    example: Calculated from a daily value percentage per serving size measure
                    type: string
                foodNutrientSource:
                    $ref: '#/components/schemas/FoodNutrientSource'
                id:
                    example: 75
                    format: int32
                    type: integer
        FoodNutrientSource:
            properties:
                code:
                    example: "12"
                    type: string
                description:
                    example: Manufacturer's analytical; partial documentation
                    type: string
                id:
                    example: 9
                    format: int32
                    type: integer
        FoodPortion:
            properties:
                amount:
                    example: 1
                    format: float
                    type: number
                dataPoints:
                    example: 9
                    format: int32
                    type: integer
                gramWeight:
                    example: 91
                    format: float
                    type: number
                id:
                    example: 135806
                    format: int32
                    type: integer
                measureUnit:
                    $ref: '#/components/schemas/MeasureUnit'
                minYearAcquired:
                    example: 2011
                    type: integer
                modifier:
                    example: "10205"
                    type: string
                portionDescription:
                    example: 1 cup
                    type: string
                sequenceNumber:
                    example: 1
                    type: integer
        FoodSearchCriteria:
            description: JSON for request body of 'search' POST request
            properties:
                brandOwner:
                    description: Optional. Filter results based on the brand owner of the food. Only applies to Branded Foods.
                    example: Kar Nut Products Company
                    type: string
                dataType:
                    description: Optional. Filter on a specific data type; specify one or more values in an array.
                    example:
                        - Foundation
                        - SR Legacy
                    items:
                        enum:
                            - Branded
                            - Foundation
                            - Survey (FNDDS)
                            - SR Legacy
                        type: string
                    maxItems: 4
                    minItems: 1
                    type: array
                pageNumber:
                    description: Optional. Page number to retrieve. The offset into the overall result set is expressed as (pageNumber * pageSize)
                    example: 2
                    type: integer
                pageSize:
                    description: Optional. Maximum number of results to return for the current page. Default is 50.
                    example: 25
                    maximum: 200
                    minimum: 1
                    type: integer
                query:
                    description: Search terms to use in the search. The string may also include standard search operators
                    example: Cheddar cheese
                    type: string
                sortBy:
                    description: Optional. Specify one of the possible values to sort by that field. Note, dataType.keyword will be dataType and lowercaseDescription.keyword will be description in future releases.
                    enum:
                        - dataType.keyword
                        - lowercaseDescription.keyword
                        - fdcId
                        - publishedDate
                    type: string
                sortOrder:
                    description: Optional. The sort direction for the results. Only applicable if sortBy is specified.
                    enum:
                        - asc
                        - desc
                    type: string
            type: object
        FoodUpdateLog:
            properties:
                availableDate:
                    example: 8/18/2018
                    type: string
                brandOwner:
                    example: Kar Nut Products Company
                    type: string
                brandedFoodCategory:
                    example: Popcorn, Peanuts, Seeds & Related Snacks
                    type: string
                changes:
                    example: Nutrient Added, Nutrient Updated
                    type: string
                dataSource:
                    example: LI
                    type: string
                dataType:
                    example: Branded
                    type: string
                description:
                    example: NUT 'N BERRY MIX
                    type: string
                fdcId:
                    example: 534358
                    type: integer
                foodAttributes:
                    items:
                        $ref: '#/components/schemas/FoodAttribute'
                    type: array
                foodClass:
                    example: Branded
                    type: string
                gtinUpc:
                    example: "077034085228"
                    type: string
                householdServingFullText:
                    example: 1 ONZ
                    type: string
                ingredients:
                    example: PEANUTS (PEANUTS, PEANUT AND/OR SUNFLOWER OIL). RAISINS. DRIED CRANBERRIES (CRANBERRIES, SUGAR, SUNFLOWER OIL). SUNFLOWER KERNELS AND ALMONDS (SUNFLOWER KERNELS AND ALMONDS, PEANUT AND/OR SUNFLOWER OIL).
                    type: string
                modifiedDate:
                    example: 8/18/2018
                    type: string
                publicationDate:
                    example: 4/1/2019
                    type: string
                servingSize:
                    example: 28
                    format: float32
                    type: integer
                servingSizeUnit:
                    example: g
                    type: string
        FoundationFoodItem:
            properties:
                dataType:
                    example: Foundation
                    type: string
                description:
                    example: Strawberries, raw
                    type: string
                fdcId:
                    example: 747448
                    type: integer
                foodCategory:
                    $ref: '#/components/schemas/FoodCategory'
                foodClass:
                    example: FinalFood
                    type: string
                foodComponents:
                    items:
                        $ref: '#/components/schemas/FoodComponent'
                    type: array
                foodNutrients:
                    items:
                        $ref: '#/components/schemas/FoodNutrient'
                    type: array
                foodPortions:
                    items:
                        $ref: '#/components/schemas/FoodPortion'
                    type: array
                footNote:
                    example: Source number reflects the actual number of samples analyzed for a nutrient. Repeat nutrient analyses may have been done on the same sample with the values shown.
                    type: string
                inputFoods:
                    items:
                        $ref: '#/components/schemas/InputFoodFoundation'
                    type: array
                isHistoricalReference:
                    example: false
                    type: boolean
                ndbNumber:
                    example: "9316"
                    type: string
                nutrientConversionFactors:
                    items:
                        $ref: '#/components/schemas/NutrientConversionFactors'
                    type: array
                publicationDate:
                    example: 12/16/2019
                    type: string
                scientificName:
                    example: Fragaria X ananassa
                    type: string
            required:
                - fdcId
                - dataType
                - description
        InputFoodFoundation:
