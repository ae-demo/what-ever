                                    type: number
                            type: object
                        carbohydrates:
                            properties:
                                value:
                                    example: 12.0008
                                    format: float
                                    type: number
                            type: object
                        cholesterol:
                            properties:
                                value:
                                    example: 0
                                    format: float
                                    type: number
                            type: object
                        fat:
                            properties:
                                value:
                                    example: 8.9992
                                    format: float
                                    type: number
                            type: object
                        fiber:
                            properties:
                                value:
                                    example: 1.988
                                    format: float
                                    type: number
                            type: object
                        iron:
                            properties:
                                value:
                                    example: 0.7196
                                    format: float
                                    type: number
                            type: object
                        postassium:
                            properties:
                                value:
                                    example: 159.88
                                    format: float
                                    type: number
                            type: object
                        protein:
                            properties:
                                value:
                                    example: 4.0012
                                    format: float
                                    type: number
