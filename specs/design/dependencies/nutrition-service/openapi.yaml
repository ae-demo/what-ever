        InputFoodSurvey:
            description: applies to Survey (FNDDS). Not all inputFoods will have all fields.
            properties:
                amount:
                    example: 1.5
                    format: float
                    type: number
                foodDescription:
                    example: Spices, curry powder
                    type: string
                id:
                    example: 18146
                    type: integer
                ingredientCode:
                    example: 2015
                    type: integer
                ingredientDescription:
                    example: Spices, curry powder
                    type: string
                ingredientWeight:
                    example: 9.45
                    format: float
                    type: number
                inputFood:
                    $ref: '#/components/schemas/SurveyFoodItem'
                portionCode:
                    example: "21000"
                    type: string
                portionDescription:
                    example: 1 tablespoon
                    type: string
                retentionFactor:
                    $ref: '#/components/schemas/RetentionFactor'
                sequenceNumber:
