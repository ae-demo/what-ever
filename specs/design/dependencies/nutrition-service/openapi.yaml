        NutrientAnalysisDetails:
            properties:
                amount:
                    example: 0
                    format: float
                    type: number
                labMethodDescription:
                    example: 10.2135/cropsci2017.04.0244
                    type: string
                labMethodLink:
                    example: https://doi.org/10.2135/cropsci2017.04.0244
                    format: url
                    type: string
                labMethodOriginalDescription:
                    type: string
                labMethodTechnique:
                    example: DOI for Beans
                    type: string
                nutrientAcquisitionDetails:
                    items:
                        $ref: '#/components/schemas/NutrientAcquisitionDetails'
                    type: array
                nutrientId:
                    example: 1005
                    type: integer
                subSampleId:
                    example: 343866
                    type: integer
        NutrientConversionFactors:
            properties:
                type:
                    example: .ProteinConversionFactor
                    type: string
                value:
                    example: 6.25
                    format: float
                    type: number
        RetentionFactor:
            properties:
                code:
                    example: 3460
                    type: integer
                description:
                    example: VEG, ROOTS, ETC, SAUTEED
                    type: string
                id:
                    example: 235
                    type: integer
        SRLegacyFoodItem:
            properties:
                dataType:
                    example: SR Legacy
                    type: string
                description:
                    example: Broccoli, raw
                    type: string
                fdcId:
                    example: 170379
                    type: integer
                foodCategory:
                    $ref: '#/components/schemas/FoodCategory'
                foodClass:
                    example: FinalFood
                    type: string
                foodNutrients:
                    items:
                        $ref: '#/components/schemas/FoodNutrient'
                    type: array
                isHistoricalReference:
                    example: true
