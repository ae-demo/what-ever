        SampleFoodItem:
            properties:
                datatype:
                    example: Sample
                    type: string
                description:
                    example: Beef, Tenderloin Roast, select, roasted, comp5, lean (34BLTR)
                    type: string
                fdcId:
                    example: 45551
                    type: integer
                foodAttributes:
                    items:
                        $ref: '#/components/schemas/FoodCategory'
                    type: array
                foodClass:
                    example: Composite
