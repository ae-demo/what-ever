                    format: uint
                    type: integer
                unitName:
                    example: g
                    type: string
        NutrientAcquisitionDetails:
            properties:
                purchaseDate:
                    example: 12/2/2005
                    type: string
                sampleUnitId:
                    example: 321632
                    type: integer
                storeCity:
